version: "3.9"

# ─── NOMAD Short Factory — 로컬 개발 스택 ────────────────────
#
# 실행: docker compose up -d
# 중지: docker compose down
# 로그: docker compose logs -f api
#
# 포트:
#   3000  — Next.js 프론트엔드
#   8000  — FastAPI 백엔드
#   6379  — Redis

services:
  # ─── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nomad_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── FastAPI 백엔드 ────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nomad_api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - /tmp/nomad_videos:/tmp/nomad_videos
      - ./backend:/app          # 핫 리로드 (개발용)
    depends_on:
      redis:
        condition: service_healthy
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --reload
    restart: unless-stopped

  # ─── Celery Worker ────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: nomad_worker
    env_file:
      - ./backend/.env
    volumes:
      - /tmp/nomad_videos:/tmp/nomad_videos
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A tasks.workers worker --loglevel=info -c 2
    restart: unless-stopped

  # ─── Celery Beat (주기 태스크) ─────────────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: nomad_beat
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A tasks.workers beat --loglevel=info
    restart: unless-stopped

volumes:
  redis_data:
