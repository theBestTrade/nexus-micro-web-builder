<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOMAD AI Factory — 글로벌 셀러 올인원 플랫폼</title>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://esm.sh/reactflow@11.10.4/dist/style.css" />
  <script>
    window.process = {
      env: {
        API_KEY: localStorage.getItem('ai-studio-api-keys')
          ? JSON.parse(localStorage.getItem('ai-studio-api-keys')).google?.key || 'mock-api-key'
          : 'mock-api-key'
      }
    };

    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Pretendard Variable"', 'Pretendard', 'Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['"Geist Mono"', 'ui-monospace', 'monospace'],
            inter: ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            ink: {
              900: '#0B1437',
              800: '#111c4a',
              700: '#1a2761',
            },
            paper: '#F8FAFC',
            border:      "hsl(var(--border))",
            input:       "hsl(var(--input))",
            ring:        "hsl(var(--ring))",
            background:  "hsl(var(--background))",
            foreground:  "hsl(var(--foreground))",
            primary: {
              DEFAULT:    "hsl(var(--primary))",
              foreground: "hsl(var(--primary-foreground))",
            },
            secondary: {
              DEFAULT:    "hsl(var(--secondary))",
              foreground: "hsl(var(--secondary-foreground))",
            },
            destructive: {
              DEFAULT:    "hsl(var(--destructive))",
              foreground: "hsl(var(--destructive-foreground))",
            },
            muted: {
              DEFAULT:    "hsl(var(--muted))",
              foreground: "hsl(var(--muted-foreground))",
            },
            card: {
              DEFAULT:    "hsl(var(--card))",
              foreground: "hsl(var(--card-foreground))",
            },
          },
        },
      },
    }
  </script>
  <style>
    html, body {
      font-family: 'Pretendard Variable', Pretendard, Inter, ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── CSS 변수 (대시보드 공통) ── */
    :root {
      --background:            210 20% 98%;
      --foreground:            222 47% 11%;
      --card:                  0 0% 100%;
      --card-foreground:       222 47% 11%;
      --popover:               0 0% 100%;
      --popover-foreground:    222 47% 11%;
      --primary:               221 83% 53%;
      --primary-foreground:    0 0% 100%;
      --secondary:             210 40% 96%;
      --secondary-foreground:  222 47% 11%;
      --muted:                 210 40% 96%;
      --muted-foreground:      215 16% 47%;
      --accent:                210 40% 94%;
      --accent-foreground:     222 47% 11%;
      --destructive:           0 72% 51%;
      --destructive-foreground: 0 0% 98%;
      --border:                214 32% 91%;
      --input:                 214 32% 91%;
      --ring:                  221 83% 53%;
      --radius:                0.5rem;
      --sidebar-bg:            222 47% 11%;
      --sidebar-fg:            215 20% 65%;
      --sidebar-fg-active:     0 0% 100%;
      --sidebar-active-bg:     221 83% 53%;
      --sidebar-border:        217 33% 17%;
    }

    body {
      background-color: hsl(var(--background));
      color: hsl(var(--foreground));
    }

    * { border-color: hsl(var(--border)); }

    /* 스크롤바 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: hsl(var(--border)); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: hsl(var(--muted-foreground)); }

    /* 모달 backdrop */
    .modal-backdrop { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }

    /* ReactFlow */
    .react-flow__node { border-radius: var(--radius); }
    .react-flow__handle { width:10px; height:10px; background-color:hsl(var(--primary)); border:2px solid #fff; }
    .react-flow__controls button { background-color:hsl(var(--card)); color:hsl(var(--foreground)); border-color:hsl(var(--border)); }
    .react-flow__controls button:hover { background-color:hsl(var(--accent)); }
    .react-flow__controls button path { fill:currentColor; }

    /* ── 랜딩 디자인 시스템 (main.html 기반) ── */

    /* Hero aurora */
    .hero-aurora {
      background:
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(99,102,241,0.45), transparent 60%),
        radial-gradient(ellipse 70% 60% at 85% 30%, rgba(34,211,238,0.30), transparent 60%),
        radial-gradient(ellipse 60% 50% at 60% 90%, rgba(168,85,247,0.28), transparent 60%),
        linear-gradient(180deg, #0B1437 0%, #0a1230 100%);
    }

    /* Aurora text gradient */
    .aurora-text {
      background: linear-gradient(135deg, #818cf8 0%, #22d3ee 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Subtle card */
    .card-soft {
      background: #fff;
      border: 1px solid rgba(11,20,55,0.08);
      box-shadow: 0 1px 0 rgba(11,20,55,0.02), 0 8px 24px -12px rgba(11,20,55,0.08);
    }
    .card-dark {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.10);
      backdrop-filter: blur(8px);
    }

    /* Dot grid */
    .bg-dots {
      background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px);
      background-size: 22px 22px;
    }
    .bg-dots-light {
      background-image: radial-gradient(rgba(11,20,55,0.06) 1px, transparent 1px);
      background-size: 22px 22px;
    }

    /* Stripe placeholder */
    .stripe-placeholder {
      background-image: repeating-linear-gradient(135deg, rgba(11,20,55,0.06) 0 1px, transparent 1px 12px);
    }

    /* Glow blob */
    .blob { filter: blur(60px); opacity: 0.55; }

    /* Marquee */
    @keyframes marquee-left {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    .marquee-track {
      animation: marquee-left 30s linear infinite;
      width: max-content;
      display: flex;
      align-items: center;
    }
    .marquee-track:hover { animation-play-state: paused; }

    /* Smooth scroll */
    html { scroll-behavior: smooth; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Text balance */
    .text-balance { text-wrap: balance; }

    /* Dashboard — shadow-card */
    .shadow-card    { box-shadow: 0 1px 2px rgba(15,23,42,0.06), 0 1px 3px rgba(15,23,42,0.04); }
    .shadow-card-md { box-shadow: 0 4px 12px rgba(15,23,42,0.08), 0 1px 3px rgba(15,23,42,0.04); }

    /* Pulse dot animation */
    @keyframes pulse-ring {
      0%   { transform: scale(1); opacity: 1; }
      70%  { transform: scale(2.2); opacity: 0; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .pulse-dot::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: inherit;
      animation: pulse-ring 2s ease-out infinite;
    }
    .pulse-dot { position: relative; }

    /* Tabular nums for numbers */
    .tabular-nums { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
