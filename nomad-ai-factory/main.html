<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NOMAD AI Factory — 글로벌 셀러 올인원 플랫폼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['"Pretendard Variable"', 'Pretendard', 'Inter', 'system-ui', 'sans-serif'],
          mono: ['"Geist Mono"', 'ui-monospace', 'monospace'],
          inter: ['Inter', 'system-ui', 'sans-serif'],
        },
        colors: {
          ink: {
            900: '#0B1437',
            800: '#111c4a',
            700: '#1a2761',
          },
          accent: {
            DEFAULT: '#2563EB',
            500: '#3b82f6',
            600: '#2563EB',
            700: '#1d4ed8',
          },
          paper: '#F8FAFC',
        },
      },
    },
  };
</script>
<style>
  html, body { font-family: 'Pretendard Variable', Pretendard, Inter, sans-serif; }
  body { color: #0B1437; background: #ffffff; -webkit-font-smoothing: antialiased; transition: background-color 0.3s ease, color 0.3s ease; }

  /* ============================================================
     DARK MODE — overrides for light surface utilities
     ============================================================ */
  [data-theme="dark"] body { background-color: #070C24; color: rgba(255,255,255,0.92); }

  /* Page-level surfaces */
  [data-theme="dark"] .bg-white            { background-color: #0F1B45 !important; }
  [data-theme="dark"] .bg-paper            { background-color: #070C24 !important; }
  [data-theme="dark"] .bg-paper\/60        { background-color: rgba(15,27,69,0.6) !important; }
  [data-theme="dark"] .bg-white\/90        { background-color: rgba(15,27,69,0.92) !important; }
  [data-theme="dark"] .bg-white\/70        { background-color: rgba(15,27,69,0.7) !important; }

  /* Card soft (white card with subtle shadow) -> elevated dark surface */
  [data-theme="dark"] .card-soft {
    background-color: #0F1B45 !important;
    border-color: rgba(255,255,255,0.10) !important;
    box-shadow: 0 1px 0 rgba(0,0,0,0.2), 0 8px 24px -12px rgba(0,0,0,0.45) !important;
  }

  /* Text */
  [data-theme="dark"] .text-ink-900        { color: #ffffff !important; }
  [data-theme="dark"] .text-ink-900\/85,
  [data-theme="dark"] .text-ink-900\/80,
  [data-theme="dark"] .text-ink-900\/75,
  [data-theme="dark"] .text-ink-900\/70    { color: rgba(255,255,255,0.85) !important; }
  [data-theme="dark"] .text-ink-900\/65,
  [data-theme="dark"] .text-ink-900\/60,
  [data-theme="dark"] .text-ink-900\/55    { color: rgba(255,255,255,0.62) !important; }
  [data-theme="dark"] .text-ink-900\/50,
  [data-theme="dark"] .text-ink-900\/45,
  [data-theme="dark"] .text-ink-900\/40,
  [data-theme="dark"] .text-ink-900\/35    { color: rgba(255,255,255,0.45) !important; }

  /* Borders / fills */
  [data-theme="dark"] .border-ink-900\/10,
  [data-theme="dark"] .border-ink-900\/8,
  [data-theme="dark"] .border-ink-900\/15  { border-color: rgba(255,255,255,0.12) !important; }
  [data-theme="dark"] .border-ink-900\/\[0\.06\] { border-color: rgba(255,255,255,0.08) !important; }
  [data-theme="dark"] .bg-ink-900\/\[0\.04\] { background-color: rgba(255,255,255,0.04) !important; }
  [data-theme="dark"] .bg-ink-900\/5        { background-color: rgba(255,255,255,0.05) !important; }
  [data-theme="dark"] .hover\:bg-ink-900\/5:hover { background-color: rgba(255,255,255,0.06) !important; }
  [data-theme="dark"] .hover\:bg-ink-900\/\[0\.04\]:hover { background-color: rgba(255,255,255,0.05) !important; }

  /* Stripe placeholder (light variant) — switch to dark variant */
  [data-theme="dark"] .stripe-placeholder {
    background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.06) 0 1px, transparent 1px 12px) !important;
    border-color: rgba(255,255,255,0.10) !important;
  }
  [data-theme="dark"] .bg-dots-dark {
    background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px) !important;
  }

  /* ink-900 backgrounds (dark sections) — slightly deepen on dark mode for contrast */
  [data-theme="dark"] .bg-ink-900          { background-color: #050918 !important; }

  /* Marquee fade overlays */
  [data-theme="dark"] .from-paper          { --tw-gradient-from: #070C24 var(--tw-gradient-from-position) !important;
                                              --tw-gradient-to: rgba(7,12,36,0) var(--tw-gradient-to-position) !important;
                                              --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to) !important; }
  [data-theme="dark"] .to-paper            { --tw-gradient-to: #070C24 var(--tw-gradient-to-position) !important; }

  /* Pricing comparison stripes */
  [data-theme="dark"] .bg-emerald-50\/50   { background-color: rgba(16,185,129,0.08) !important; }
  [data-theme="dark"] .border-emerald-200\/50 { border-color: rgba(16,185,129,0.25) !important; }

  /* Accent tints on dark */
  [data-theme="dark"] .bg-accent\/10       { background-color: rgba(59,130,246,0.18) !important; }
  [data-theme="dark"] .text-accent-700     { color: #93c5fd !important; }

  /* Value statement gradient card — darken */
  [data-theme="dark"] .from-indigo-50      { --tw-gradient-from: rgba(99,102,241,0.12) var(--tw-gradient-from-position) !important;
                                              --tw-gradient-to: rgba(99,102,241,0) var(--tw-gradient-to-position) !important;
                                              --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-via, var(--tw-gradient-to)), var(--tw-gradient-to) !important; }
  [data-theme="dark"] .via-cyan-50         { --tw-gradient-via: rgba(34,211,238,0.10) var(--tw-gradient-via-position) !important;
                                              --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-via), var(--tw-gradient-to) !important; }
  [data-theme="dark"] .to-fuchsia-50       { --tw-gradient-to: rgba(168,85,247,0.12) var(--tw-gradient-to-position) !important; }

  .font-mono, .mono { font-family: 'Geist Mono', ui-monospace, monospace; letter-spacing: -0.01em; }
  .num { font-family: 'Inter', system-ui, sans-serif; font-feature-settings: "tnum"; }
  .text-balance { text-wrap: balance; }
  .text-pretty { text-wrap: pretty; }

  /* Dotted grid texture */
  .bg-dots {
    background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  .bg-dots-dark {
    background-image: radial-gradient(rgba(11,20,55,0.07) 1px, transparent 1px);
    background-size: 22px 22px;
  }

  /* Hero aurora */
  .hero-aurora {
    background:
      radial-gradient(ellipse 80% 50% at 20% 10%, rgba(99,102,241,0.45), transparent 60%),
      radial-gradient(ellipse 70% 60% at 85% 30%, rgba(34,211,238,0.30), transparent 60%),
      radial-gradient(ellipse 60% 50% at 60% 90%, rgba(168,85,247,0.28), transparent 60%),
      linear-gradient(180deg, #0B1437 0%, #0a1230 100%);
  }

  /* Stripe placeholder pattern */
  .stripe-placeholder {
    background-image: repeating-linear-gradient(
      135deg,
      rgba(11,20,55,0.06) 0 1px,
      transparent 1px 12px
    );
  }
  .stripe-placeholder-dark {
    background-image: repeating-linear-gradient(
      135deg,
      rgba(255,255,255,0.06) 0 1px,
      transparent 1px 12px
    );
  }

  /* Marquee */
  @keyframes marquee-left {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  .marquee-track {
    animation: marquee-left 40s linear infinite;
    width: max-content;
  }
  .marquee-track:hover { animation-play-state: paused; }

  /* Glow blob */
  .blob {
    filter: blur(60px);
    opacity: 0.6;
  }

  /* Crisp focus ring */
  button:focus-visible, a:focus-visible {
    outline: 2px solid #2563EB;
    outline-offset: 3px;
    border-radius: 4px;
  }

  /* Smooth scroll for nav anchors */
  html { scroll-behavior: smooth; }

  /* Hide scrollbars on horizontal lists */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  /* Subtle card */
  .card-soft {
    background: #fff;
    border: 1px solid rgba(11,20,55,0.08);
    box-shadow: 0 1px 0 rgba(11,20,55,0.02), 0 8px 24px -12px rgba(11,20,55,0.08);
  }
  .card-dark {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.10);
    backdrop-filter: blur(8px);
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="src/icons.jsx"></script>
  <script type="text/babel" src="src/atoms.jsx"></script>
  <script type="text/babel" src="src/sections-top.jsx"></script>
  <script type="text/babel" src="src/sections-mid.jsx"></script>
  <script type="text/babel" src="src/sections-pricing.jsx"></script>
  <script type="text/babel" src="src/sections-bottom.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
